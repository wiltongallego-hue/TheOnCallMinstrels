<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>The On-Call Minstrels — walking loop</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      .layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>
    <!-- Seamless loop: 162 frames at 24 fps (6.75 s). The last frame flows straight into the first.
         Generated by tools/loop_pipeline/build_hyperframes.py from remotion/public/timeline.json. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.75" data-width="1280" data-height="720" data-fps="24">
      <!-- original gameplay (walk right, arrival) and reconstructed clean plates (stop, walk back) -->
      <video id="loop-background" class="clip layer" src="assets/loop_background.webm" data-start="0" data-duration="6.75" data-track-index="0" muted playsinline></video>
      <!-- the wizard walking back: mirrored RGBA sprites, transparent everywhere else -->
      <video id="loop-wizard" class="clip layer" src="assets/loop_wizard.webm" data-start="0" data-duration="6.75" data-track-index="1" muted playsinline></video>
    </div>
    <script>
      // Both layers are framework-owned media; the timeline only has to exist.
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
